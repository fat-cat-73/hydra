name: Build Hydra iOS

on:
  workflow_dispatch:

jobs:
  build:
    name: Build unsigned iOS app
    runs-on: macos-latest

    steps:
      - name: Checkout Hydra
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Disable Sentry source map upload
        run: echo "SENTRY_DISABLE_AUTO_UPLOAD=true" >> "$GITHUB_ENV"

      - name: Generate iOS project
        run: npx expo prebuild --platform ios --non-interactive

      - name: Install CocoaPods dependencies
        working-directory: ios
        run: pod install

      - name: Build unsigned iOS app
        working-directory: ios
        run: |
          xcodebuild \
            -workspace Hydra.xcworkspace \
            -scheme Hydra \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""

      - name: Package IPA
        run: |
          mkdir Payload
          cp -R ios/build/Build/Products/Release-iphoneos/Hydra.app Payload/
          zip -r Hydra.ipa Payload

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: Hydra-unsigned-IPA
          path: Hydra.ipa
